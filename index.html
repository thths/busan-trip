<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>釜山旅遊手帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<script>
(function(){
  var t=null;
  try{t=localStorage.getItem('busan.theme');}catch(e){}
  if(!t){t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}
  document.documentElement.setAttribute('data-theme',t);
})();
</script>
<style>
:root{
  --bg:#f7f0e1;--bg2:#ecdfc4;--card:#fffdf6;--ink:#12325a;--mut:#506a8a;
  --line:#12325a;--shadow:#12325a;
  --pink:#ff8160;--blue:#46b8e8;--green:#2fbf9b;--yellow:#ffc84a;--purple:#6f84e0;--red:#e0483f;
  --on-accent:#12325a;
}
[data-theme="dark"]{
  --bg:#0b1f33;--bg2:#10293f;--card:#14324d;--ink:#eaf6ff;--mut:#8fb2cc;
  --line:#6fb8e0;--shadow:#040d18;
  --pink:#ff9770;--blue:#5cc3f0;--green:#43d3b0;--yellow:#ffd166;--purple:#8e9cf0;--red:#ff6b62;
  --on-accent:#0b1f33;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:'DotGothic16','PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif;
  font-size:15px;line-height:1.55;
  background-image:linear-gradient(var(--bg2) 1px,transparent 1px),linear-gradient(90deg,var(--bg2) 1px,transparent 1px);
  background-size:16px 16px;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
}
a{color:inherit}
header.top{
  background:var(--blue);color:var(--on-accent);
  border-bottom:4px solid var(--line);
  padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
  position:sticky;top:0;z-index:20;
}
.top-row{display:flex;align-items:center;gap:10px}
.top h1{font-size:19px;margin:0;flex:1;letter-spacing:1px;white-space:nowrap}
.top .sub{font-size:12px;opacity:.85;margin-top:12px}
.themebtn{
  font:inherit;font-size:13px;border:3px solid var(--line);background:var(--card);color:var(--ink);
  padding:4px 8px;box-shadow:3px 3px 0 var(--shadow);cursor:pointer;min-height:36px;
}
.themebtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
main{padding:14px 14px 8px;max-width:640px;margin:0 auto}
h2.sec{font-size:17px;margin:18px 0 8px;display:flex;align-items:center;gap:8px}
h2.sec::before{content:"";width:12px;height:12px;background:var(--pink);border:2px solid var(--line);display:inline-block}
.card{
  background:var(--card);border:3px solid var(--line);box-shadow:4px 4px 0 var(--shadow);
  padding:12px;margin:0 0 14px;
}
.card h3{margin:0 0 6px;font-size:16px;word-break:break-word}
.muted{color:var(--mut)}
.tbc{color:var(--red);font-weight:bold}
.est{color:var(--purple);font-size:.9em}
.badge{
  display:inline-block;font-size:12px;padding:0 6px;border:2px solid var(--line);
  margin:0 4px 4px 0;background:var(--yellow);color:var(--on-accent);line-height:1.5;
}
.badge.sight{background:var(--blue)}
.badge.food{background:var(--yellow)}
.badge.shop{background:var(--green)}
.badge.pass-p{background:var(--purple)}
.badge.pass-b{background:var(--blue)}
.badge.flight{background:var(--pink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  font:inherit;flex:0 0 auto;border:3px solid var(--line);background:var(--card);color:var(--ink);
  padding:4px 12px;cursor:pointer;box-shadow:3px 3px 0 var(--shadow);min-height:44px;text-align:center;
}
.chip small{display:block;font-size:11px;color:var(--mut)}
.chip.on{background:var(--yellow);color:var(--on-accent)}
.chip.on small{color:var(--on-accent)}
.btn{
  display:inline-block;font:inherit;text-decoration:none;cursor:pointer;
  border:3px solid var(--line);background:var(--green);color:var(--on-accent);
  padding:6px 12px;box-shadow:3px 3px 0 var(--shadow);min-height:40px;
}
.btn.alt{background:var(--card);color:var(--ink)}
.btn.pink{background:var(--pink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.btn[disabled],.btn.off{opacity:.5;pointer-events:none}
.it{display:flex;gap:10px}
.it .time{
  flex:0 0 68px;font-size:14px;border-right:3px dashed var(--line);padding-right:8px;
  word-break:keep-all;
}
.it .body{flex:1;min-width:0}
.f{display:flex;gap:8px;font-size:13px;margin:2px 0}
.f .k{flex:0 0 3.6em;color:var(--mut)}
.f .v{flex:1;min-width:0;word-break:break-word}
.note{font-size:13px;margin:6px 0;padding:6px 8px;border-left:4px solid var(--pink);background:var(--bg2)}
.warn{border-left-color:var(--red)}
.hint{font-size:12px;color:var(--mut);margin-top:4px}
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
  background:var(--card);border-top:4px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.tabbar button{
  flex:1;font:inherit;border:0;border-right:2px solid var(--line);background:transparent;color:var(--ink);
  padding:6px 0 5px;cursor:pointer;min-height:56px;font-size:11px;line-height:1.2;
}
.tabbar button:last-child{border-right:0}
.tabbar button span{display:block;font-size:20px;line-height:1.2}
.tabbar button.on{background:var(--yellow);color:var(--on-accent)}
.bar{display:flex;gap:2px;margin:6px 0}
.bar i{flex:1;height:14px;border:2px solid var(--line);background:var(--bg2)}
.bar i.on{background:var(--green)}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:2px dotted var(--line)}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0;word-break:break-word}
.row small{display:block;color:var(--mut);font-size:12px}
.cb{
  appearance:none;-webkit-appearance:none;width:26px;height:26px;flex:0 0 26px;
  border:3px solid var(--line);background:var(--card);margin:0;cursor:pointer;position:relative;
}
.cb:checked{background:var(--green)}
.cb:checked::after{content:"";position:absolute;left:5px;top:0px;width:7px;height:14px;border:solid var(--on-accent);border-width:0 4px 4px 0;transform:rotate(45deg)}
.row.done .grow{text-decoration:line-through;opacity:.6}
input[type=text],input[type=number],select{
  font:inherit;color:var(--ink);background:var(--card);border:3px solid var(--line);
  padding:6px 8px;min-height:40px;width:100%;border-radius:0;
}
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.form .full{grid-column:1/-1}
.x{font:inherit;border:2px solid var(--line);background:var(--card);color:var(--ink);width:32px;height:32px;cursor:pointer}
iframe.map{width:100%;height:300px;border:3px solid var(--line);background:var(--bg2);display:block}
.wx{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.wx .card{margin:0;text-align:center;padding:8px}
.wx .big{font-size:28px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:2px dotted var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--mut);flex:0 0 auto}
.kv span:last-child{text-align:right;word-break:break-word}
footer.foot{font-size:12px;color:var(--mut);padding:6px 16px 20px;max-width:640px;margin:0 auto}
@media (min-width:560px){main{padding-top:20px}}

/* ---- 動畫與插圖 ---- */
:root{--sky:#cdeefc;--sea:#2ea6d8;--sun:#ffb454;--cloud:#ffffff;--plane:#ffffff}
[data-theme="dark"]{--sky:#12345a;--sea:#1d5f8f;--sun:#fff1c9;--cloud:#2d5a86;--plane:#eaf6ff}
.logo{display:inline-block;vertical-align:0;line-height:1;animation:sway 3.2s ease-in-out infinite;transform-origin:50% 100%}
@keyframes sway{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.themebtn[disabled]{opacity:.6;cursor:default}
.flightcard{padding:0;overflow:hidden}
.hero{display:block;width:100%;height:auto;background:var(--sky);shape-rendering:crispEdges}
.hero .cloud{animation:drift 28s linear infinite}
.hero .cloud.c2{animation-duration:40s;animation-delay:-15s}
@keyframes drift{from{transform:translateX(-90px)}to{transform:translateX(400px)}}
.hero .plane{animation:fly 9s linear infinite}
@keyframes fly{0%{transform:translate(-60px,14px);opacity:1}70%{transform:translate(170px,4px);opacity:1}90%{transform:translate(170px,4px);opacity:1}100%{transform:translate(170px,4px);opacity:0}}
.hero .pin{animation:bob 1.2s ease-in-out infinite}
.hero .sun{animation:bob 3.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
.hero .wave{animation:wave 2.6s steps(4) infinite}
@keyframes wave{from{transform:translateX(0)}to{transform:translateX(-32px)}}
.hero .petal{animation:fall 8s linear infinite}
.hero .petal.p2{animation-delay:-3s;animation-duration:10s}
.hero .petal.p3{animation-delay:-6s;animation-duration:9s}
@keyframes fall{from{transform:translate(0,-8px)}to{transform:translate(-36px,96px)}}
.pass{padding:10px 12px;border-top:3px dashed var(--line);position:relative}
.pass.now{background:var(--yellow);color:var(--on-accent)}
.pass .hd{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--mut)}
.pass.now .hd{color:var(--on-accent)}
.pass .big{display:flex;align-items:center;gap:8px;font-size:24px;margin:4px 0 2px}
.pass .big .city{display:block;font-size:12px;opacity:.8}
.pass .mid{flex:1;position:relative;height:24px;min-width:40px}
.pass .mid::before{content:"";position:absolute;left:0;right:0;top:11px;border-top:3px dotted currentColor;opacity:.6}
.pass .mid span{position:absolute;top:0;left:0;font-size:18px;line-height:24px;animation:cruise 3.6s linear infinite}
@keyframes cruise{from{left:-6%}to{left:92%}}
.pass .meta{font-size:13px}
.pass .tag{display:inline-block;border:2px solid var(--line);background:var(--card);color:var(--ink);padding:0 6px;font-size:12px}
.pop .card.it{animation:bounceIn .55s cubic-bezier(.34,1.56,.64,1) both;animation-delay:calc(min(var(--i),7) * 70ms)}
@keyframes bounceIn{0%{opacity:0;transform:translateY(28px) scale(.94)}55%{opacity:1;transform:translateY(-7px) scale(1.02)}100%{opacity:1;transform:none}}
.pop .daytitle{animation:bounceIn .5s cubic-bezier(.34,1.56,.64,1) both}
.chip.on.pop{animation:chipPop .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes chipPop{0%{transform:scale(.8) translateY(6px)}60%{transform:scale(1.12) translateY(-3px)}100%{transform:none}}
.chip:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
/* 減少動態效果：系統設定或手動關閉 */
@media (prefers-reduced-motion: reduce){.hero .walk,.hero .stpA,.hero .stpB{animation:none!important}.hero .stpB{opacity:0}.hero .walk{transform:translateX(calc(var(--i)*14px))!important;opacity:1!important}
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
[data-motion="off"] *,[data-motion="off"] *::before,[data-motion="off"] *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}

button.pass{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:transparent;border:0;border-top:3px dashed var(--line);cursor:pointer}
button.pass:active{transform:translate(2px,2px)}
.arrive{padding:6px 12px;font-size:13px;border-top:3px solid var(--line);background:var(--card)}
.route{display:flex;flex-wrap:wrap;align-items:center;gap:4px 0;margin:8px 0}
.route .node{font:inherit;width:32px;height:32px;border:3px solid var(--line);background:var(--card);color:var(--ink);box-shadow:2px 2px 0 var(--shadow);cursor:pointer;padding:0}
.route .node.on{background:var(--yellow);color:var(--on-accent)}
.route .link{width:26px;height:28px;border:0;background:transparent;position:relative;color:var(--ink);font:inherit;padding:0;cursor:pointer}
.route .link::before{content:"";position:absolute;left:0;right:6px;top:13px;border-top:4px dotted currentColor}
.route .link::after{content:"";position:absolute;right:0;top:8px;border:6px solid transparent;border-left:6px solid currentColor;border-right:0}
.route .link.on{color:var(--pink)}
.route .link.on::before{border-top-style:solid}
.route .gap{cursor:default;text-align:center;opacity:.6;line-height:28px}
.route .gap::before,.route .gap::after{display:none}
@media (prefers-reduced-motion: reduce){.hero .plane{transform:translate(170px,4px)!important}}
[data-motion="off"] .hero .plane{transform:translate(170px,4px)!important}

.hero .train{animation:ride 8s linear infinite}
@keyframes ride{from{transform:translateX(-160px)}to{transform:translateX(330px)}}
.hero .glide{animation:glide 9s linear infinite}
@keyframes glide{0%{transform:translate(0,0)}25%{transform:translate(62px,13px)}50%{transform:translate(125px,18px)}75%{transform:translate(187px,13px)}100%{transform:translate(250px,0)}}
.hero .twinkle{animation:blink 1.4s steps(2) infinite}
.hero .twinkle.t2{animation-delay:-.7s}
@keyframes blink{50%{opacity:.15}}
.hero .guest{animation:bob 1.6s ease-in-out infinite}
.hero .walk{animation:walkin 9s linear infinite}
.hero .stpA{animation:stpA .5s steps(1) infinite}.hero .stpB{animation:stpB .5s steps(1) infinite}
@keyframes walkin{0%{transform:translateX(-30px);opacity:1}88%{transform:translateX(150px);opacity:1}100%{transform:translateX(158px);opacity:0}}
@keyframes stpA{0%{opacity:1}50%{opacity:0}}@keyframes stpB{0%{opacity:0}50%{opacity:1}}
[data-motion="off"] .hero .walk,[data-motion="off"] .hero .stpA,[data-motion="off"] .hero .stpB{animation:none!important}
[data-motion="off"] .hero .stpB{opacity:0}
[data-motion="off"] .hero .walk{transform:translateX(calc(var(--i)*14px))!important;opacity:1!important}

.pass.static{cursor:default}
@media (prefers-reduced-motion: reduce){.hero .train{transform:translateX(120px)!important}.hero .glide{transform:translate(125px,18px)!important}}
[data-motion="off"] .hero .train{transform:translateX(120px)!important}
[data-motion="off"] .hero .glide{transform:translate(125px,18px)!important}

.mapsvg{display:block;width:100%;height:auto;border:3px solid var(--line);box-shadow:4px 4px 0 var(--shadow);background:var(--sky);shape-rendering:crispEdges}
.mapsvg .flow{stroke-dasharray:6 6;animation:dashflow 1s linear infinite}
@keyframes dashflow{to{stroke-dashoffset:-12}}
.mapsvg a{cursor:pointer}
.mapsvg .pinb{animation:bob 1.4s ease-in-out infinite}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;margin:8px 0}
.legend i{display:inline-block;width:12px;height:12px;border:2px solid var(--line);vertical-align:-2px;margin-right:4px}

.hero .drop{animation:drop .7s linear infinite}
@keyframes drop{from{transform:translateY(-8px)}to{transform:translateY(100px)}}
.hero .snowf{animation:snowfall 3s linear infinite}
@keyframes snowfall{from{transform:translate(0,-6px)}to{transform:translate(-8px,100px)}}
</style>
</head>

  for(let i=0;i<5;i++)g+=`<g class="guest" style="animation-delay:-${i*.3}s">${gridRects(charSprite(i,'base',false,0),2,24+i*60,48)}</g>`;
  // 天氣效果（畫在人物之前的前景）
  if(kind==='rain'||kind==='storm')g+=Array.from({length:22},(_,i)=>`<rect class="drop" x="${6+i*14.5}" y="${(i*17)%50}" width="2" height="8" fill="var(--blue)" style="animation-delay:-${(i%6)*.14}s"/>`).join('');
  if(kind==='storm')g+='<g class="twinkle"><polygon points="160,24 150,48 158,48 152,70 172,42 163,42 170,24" fill="var(--yellow)" stroke="var(--line)" stroke-width="1"/></g>';
  if(kind==='snow')g+=Array.from({length:26},(_,i)=>`<rect class="snowf" x="${4+i*12.2}" y="${(i*23)%60}" width="3" height="3" fill="#ffffff" stroke="#9db3c8" stroke-width=".5" style="animation-delay:-${(i%7)*.45}s"/>`).join('');
  if(kind==='fog')g+='<rect y="30" width="320" height="14" fill="#ffffff" opacity=".4"/><rect y="52" width="320" height="18" fill="#ffffff" opacity=".28"/><rect y="74" width="320" height="14" fill="#ffffff" opacity=".18"/>';
  return `<svg class="hero" viewBox="0 0 320 108" role="img" aria-label="釜山海邊天氣：${WKIND[kind]}">${g}</svg>`;
}
function outfitTier(max){return max>=25?'warm':max>=18?'mild':max>=12?'cool':max>=6?'cold':'freeze';}

function renderWx(){
  const d=daysToTrip();
  let h=`<div class="card"><h3>📍 釜山・3/11–3/15</h3><div class="kv"><span>距出發</span><span>${d>0?d+' 天':d===0?'今天出發！':'旅程進行中或已結束'}</span></div></div>`;
  { // 天氣預報插圖
    let kind='partly',est=true,x=null;
    if(d<=15&&WX.state==='ok'&&WX.cache[state.day-1]){x=WX.cache[state.day-1];kind=weatherKind(x.code,x.pop);est=false;
      h+='<div class="chips">'+DAYS.map(dd=>`<button class="chip ${dd.n===state.day?'on':''}" data-day="${dd.n}">Day ${dd.n}<small>${dd.date}（${dd.w}）</small></button>`).join('')+'</div>';}
    h+='<h2 class="sec">天氣預報</h2><div class="card flightcard">'+weatherSvg(kind)+'</div>';
    h+=`<div class="hint">${est?'尚無預報，畫面為示意（估算）；3 月白天約 10–15°C。':`${x.date}　${WKIND[kind]}　最高 ${x.max}°C／最低 ${x.min}°C${x.pop==null?'':'　降雨機率 '+x.pop+'%'}`}</div>`;
  }
  if(d>15){
    h+=`<div class="card"><h3>預報尚未開放</h3><p class="muted">天氣預報大約只能查未來 16 天。距離出發還有 ${d} 天，所以現在還沒有這幾天的預報。出發前約 2 週，打開這頁會自動載入。</p></div>`;
  }else if(WX.state==='ok'){
    h+='<h2 class="sec">逐日預報</h2><div class="wx">'+WX.cache.map(x=>`<div class="card"><div>${x.date}</div><div class="big">${wxIcon(x.code)}</div><div>${x.max}° / ${x.min}°</div><div class="hint">降雨機率 ${x.pop==null?'待確認':x.pop+'%'}</div></div>`).join('')+'</div>';
    h+='<div class="hint">資料來源：Open-Meteo（釜山市區座標，當地時間）。</div>';
  }else if(WX.state==='err'){
    h+='<div class="card"><h3>載入失敗</h3><p class="muted">目前拿不到預報，可能是沒有網路。預報：待確認。</p></div>';
  }else{
    h+='<div class="card"><p class="muted">載入預報中…</p></div>';loadWx();
  }
  h+=`<h2 class="sec">3 月釜山氣候參考 <span class="est">（估算）</span></h2>
   <div class="card">
     <div class="kv"><span>白天</span><span>約 10–15°C <span class="est">（估算）</span></span></div>
     <div class="kv"><span>早晚</span><span>約 3–7°C <span class="est">（估算）</span></span></div>
     <div class="kv"><span>體感</span><span>海邊風大，比氣溫冷 <span class="est">（估算）</span></span></div>
     <div class="hint">這是我依一般 3 月氣候推估，不是預報，出發前請以預報為準。打包清單裡已有外套、帽子、Sunscreen。</div>
   </div>
   <p><a class="btn alt" target="_blank" rel="noopener" href="https://www.google.com/search?q=${encodeURIComponent('釜山 天氣')}">🔎 查看最新天氣</a></p>`;
  return h;
}
async function loadWx(){
  if(WX.state==='loading')return;WX.state='loading';
  try{
    const u='https://api.open-meteo.com/v1/forecast?latitude=35.1796&longitude=129.0756&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FSeoul&start_date='+TRIP.start+'&end_date='+TRIP.end;
    const r=await fetch(u);if(!r.ok)throw new Error('http '+r.status);
    const j=await r.json();const D=j.daily;
    WX.cache=D.time.map((t,i)=>({date:t.slice(5).replace('-','/'),code:D.weather_code[i],max:Math.round(D.temperature_2m_max[i]),min:Math.round(D.temperature_2m_min[i]),pop:D.precipitation_probability_max?D.precipitation_probability_max[i]:null}));
    WX.state='ok';
  }catch(e){WX.state='err';}
  if(state.tab==='wx')render();
}

/* ============ 清單 ============ */
function renderList(){
  const todo=store.get('todo',TODO0.map(t=>t.d));
  const shop=store.get('shop',[]);
  const pack=store.get('pack',PACK0.map(()=>false));
  const td=todo.filter(Boolean).length;
  let h=`<h2 class="sec">待辦 ${td}/${TODO0.length}</h2><div class="card">${blocks(td,TODO0.length)}`;
  TODO0.forEach((t,i)=>{
    h+=`<label class="row ${todo[i]?'done':''}"><input class="cb" type="checkbox" data-todo="${i}" ${todo[i]?'checked':''}><div class="grow">${esc(t.n)}${t.hint?`<small>${esc(t.hint)}</small>`:''}${t.link?`<small><a href="${t.link}" target="_blank" rel="noopener">官方填寫網站</a></small>`:''}</div></label>`;
  });
  h+='</div>';
  h+='<h2 class="sec">購物清單</h2><div class="card"><div class="hint" style="margin:0 0 6px">Notion 行程裡標為「購物」的地點如下；要買什麼：待確認，可自己加。</div>';
  SHOP_SPOTS.forEach(s=>{h+=`<div class="row"><div class="grow"><b>${esc(s.n)}</b><small>${esc(s.when)}</small></div></div>`;});
  h+='</div><div class="card"><h3>想買的東西</h3>';
  if(!shop.length)h+='<div class="muted">還沒有項目（待確認）。</div>';
  shop.forEach((s,i)=>{h+=`<label class="row ${s.d?'done':''}"><input class="cb" type="checkbox" data-shop="${i}" ${s.d?'checked':''}><div class="grow">${esc(s.n)}</div><button class="x" data-shopdel="${i}" aria-label="刪除">×</button></label>`;});
  h+='<div class="form"><input class="full" type="text" id="shopIn" placeholder="輸入想買的東西"><button class="btn full" id="shopAdd">＋ 加入</button></div></div>';
  const px=store.get('packx',[]);
  const pd=pack.filter((v,i)=>v&&PACK0[i][2]!==null).length+px.filter(x=>x.d).length,pt=PACK_TOTAL+px.length;
  h+=`<h2 class="sec">打包清單 ${pd}/${pt}</h2><div class="card">${blocks(pd,pt)}</div>`;
  PACK_GROUPS.forEach(g=>{
    h+=`<div class="card"><h3>${g||'其他（Notion 未分類）'}</h3>`;
    PACK0.forEach((p,i)=>{
      if(p[2]!==g)return;
      h+=`<label class="row ${pack[i]?'done':''}"><input class="cb" type="checkbox" data-pack="${i}" ${pack[i]?'checked':''}><div class="grow">${esc(p[0])}${p[1]!=null?' × '+p[1]:''}${p[3]?`<small>${esc(p[3])}</small>`:''}</div></label>`;
    });
    px.forEach((x,j)=>{if(x.g!==g)return;h+=`<label class="row ${x.d?'done':''}"><input class="cb" type="checkbox" data-packx="${j}" ${x.d?'checked':''}><div class="grow">${esc(x.n)}<small>自己新增</small></div><button class="x" data-packdel="${j}" aria-label="刪除">×</button></label>`;});
    h+='</div>';
  });
  if(px.some(x=>x.g==='自訂')){
    h+='<div class="card"><h3>自訂</h3>';
    px.forEach((x,j)=>{if(x.g!=='自訂')return;h+=`<label class="row ${x.d?'done':''}"><input class="cb" type="checkbox" data-packx="${j}" ${x.d?'checked':''}><div class="grow">${esc(x.n)}<small>自己新增</small></div><button class="x" data-packdel="${j}" aria-label="刪除">×</button></label>`;});
    h+='</div>';
  }
  h+='<div class="card"><h3>＋ 新增打包項目</h3><div class="form"><input class="full" type="text" id="packIn" placeholder="輸入要帶的東西"><select id="packG" class="full">'+PACK_GROUPS.concat('自訂').map(g=>`<option>${g}</option>`).join('')+'</select><button class="btn full" id="packAdd">＋ 加入</button></div></div>';
  return h;
}

/* ============ 記帳 ============ */
function renderMoney(){
  const mine=store.get('exp',[]);
  const cur='TWD,KRW'.split(',');
  const sums={};let unk=0;
  EXP0.forEach(e=>{if(e.amt!=null)unk+=e.amt;});
  mine.forEach(e=>{sums[e.cur]=(sums[e.cur]||0)+e.amt;});
  let h='<h2 class="sec">合計</h2><div class="card">';
  h+=`<div class="kv"><span>Notion 合計（台幣）</span><span>NT$ ${fmt(unk)}</span></div>`;
  cur.forEach(c=>{h+=`<div class="kv"><span>我新增的 ${c}</span><span>${fmt(sums[c]||0)}</span></div>`;});
  h+='<div class="hint">Notion 的費用表有 7 筆，只有機票、住宿填了金額（皆為台幣），其餘金額：待確認。</div></div>';
  h+='<h2 class="sec">Notion 費用明細</h2><div class="card">';
  EXP0.forEach(e=>{
    h+=`<div class="row"><div class="grow"><b>${esc(e.n)}</b><small>${esc(e.cat)}・${e.date?esc(e.date):'日期待確認'}${e.note?'・'+esc(e.note):''}</small></div><div>${e.amt!=null?(e.cur==='TWD'?'NT$ ':'')+fmt(e.amt):TBC}</div></div>`;
  });
  h+='</div><h2 class="sec">我的記帳</h2><div class="card">';
  if(!mine.length)h+='<div class="muted">還沒有記錄。</div>';
  mine.forEach((e,i)=>{
    h+=`<div class="row"><div class="grow"><b>${esc(e.n)}</b><small>${esc(e.cat)}・${esc(e.date)}</small></div><div>${fmt(e.amt)} ${esc(e.cur)}</div><button class="x" data-expdel="${i}" aria-label="刪除">×</button></div>`;
  });
  h+=`<div class="form">
    <input class="full" type="text" id="expN" placeholder="品項（例：晚餐）">
    <input type="number" id="expA" inputmode="decimal" placeholder="金額">
    <select id="expC"><option>TWD</option><option>KRW</option></select>
    <select id="expK" class="full"><option>餐飲</option><option>交通</option><option>購物</option><option>門票娛樂</option><option>住宿</option><option>其他</option></select>
    <button class="btn full" id="expAdd">＋ 新增一筆</button></div></div>`;
  return h;
}

/* ============ 主渲染與事件 ============ */
function render(){
  const fn={trip:renderTrip,fly:renderFly,map:renderMap,wx:renderWx,list:renderList,money:renderMoney}[state.tab];
  stopRunner();
  document.getElementById('app').innerHTML=fn();
  if(state.tab==='map')startRunner();
  document.getElementById('tabbar').innerHTML=TABS.map(t=>`<button data-tab="${t[0]}" class="${t[0]===state.tab?'on':''}"><span>${t[1]}</span>${t[2]}</button>`).join('');
  const d=daysToTrip();
  document.getElementById('topSub').textContent='2027/3/11（四）– 3/15（一）・4 晚 5 天・'+(d>0?'距出發 '+d+' 天':d===0?'今天出發':'旅程中');
}
function setTab(t){state.tab=t;store.set('tab',t);render();window.scrollTo(0,0);}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-tab],[data-day],[data-fl],[data-leg],[data-mapmode],[data-stop],[data-shopdel],[data-expdel],#shopAdd,#expAdd,#packAdd,[data-packdel]');
  if(!b)return;
  if(b.dataset.tab){setTab(b.dataset.tab);return;}
  if(b.dataset.day){state.day=+b.dataset.day;state.anim=(state.tab==='trip');store.set('day',state.day);mapSel=null;mapLeg=null;render();return;}
  if(b.dataset.leg!=null){mapLeg=+b.dataset.leg;mapSel=null;render();return;}
  if(b.dataset.mapmode){mapMode=b.dataset.mapmode;store.set('mapMode',mapMode);render();return;}
  if(b.dataset.stop!=null){mapSel=mapStops(state.day)[+b.dataset.stop];mapLeg=null;render();return;}
  if(b.dataset.shopdel!=null){const a=store.get('shop',[]);a.splice(+b.dataset.shopdel,1);store.set('shop',a);render();return;}
  if(b.dataset.expdel!=null){const a=store.get('exp',[]);a.splice(+b.dataset.expdel,1);store.set('exp',a);render();return;}
  if(b.dataset.packdel!=null){const a=store.get('packx',[]);a.splice(+b.dataset.packdel,1);store.set('packx',a);render();return;}
  if(b.id==='packAdd'){const v=document.getElementById('packIn').value.trim();if(!v)return;const a=store.get('packx',[]);a.push({n:v,g:document.getElementById('packG').value,d:false});store.set('packx',a);render();return;}
  if(b.id==='shopAdd'){const v=document.getElementById('shopIn').value.trim();if(!v)return;const a=store.get('shop',[]);a.push({n:v,d:false});store.set('shop',a);render();return;}
  if(b.id==='expAdd'){
    const n=document.getElementById('expN').value.trim();const amt=parseFloat(document.getElementById('expA').value);
    if(!n||isNaN(amt))return;
    const d=new Date();const a=store.get('exp',[]);
    a.push({n,amt,cur:document.getElementById('expC').value,cat:document.getElementById('expK').value,date:(d.getMonth()+1)+'/'+d.getDate()});
    store.set('exp',a);render();return;
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.todo!=null){const a=store.get('todo',TODO0.map(x=>x.d));a[+t.dataset.todo]=t.checked;store.set('todo',a);render();}
  else if(t.dataset.packx!=null){const a=store.get('packx',[]);a[+t.dataset.packx].d=t.checked;store.set('packx',a);render();}
  else if(t.dataset.pack!=null){const a=store.get('pack',PACK0.map(()=>false));a[+t.dataset.pack]=t.checked;store.set('pack',a);render();}
  else if(t.dataset.shop!=null){const a=store.get('shop',[]);a[+t.dataset.shop].d=t.checked;store.set('shop',a);render();}
});
const themeBtn=document.getElementById('themeBtn');
function syncThemeBtn(){themeBtn.textContent=document.documentElement.getAttribute('data-theme')==='dark'?'淺色':'深色';}
themeBtn.addEventListener('click',()=>{
  const n=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',n);
  try{localStorage.setItem('busan.theme',n);}catch(e){}
  syncThemeBtn();
});
syncThemeBtn();
const motionBtn=document.getElementById('motionBtn');
const mq=window.matchMedia?matchMedia('(prefers-reduced-motion: reduce)'):null;
function applyMotion(){
  const osReduce=!!(mq&&mq.matches);
  const off=osReduce||store.get('motionOff',false);
  document.documentElement.setAttribute('data-motion',off?'off':'on');
  motionBtn.textContent=osReduce?'動態 系統關':(off?'動態 關':'動態 開');
  motionBtn.disabled=osReduce;
  if(state.tab==='map')startRunner();
  motionBtn.title=osReduce?'你的裝置已開啟「減少動態效果」，所以動畫維持關閉':'開關動畫';
}
motionBtn.addEventListener('click',()=>{store.set('motionOff',!store.get('motionOff',false));applyMotion();});
if(mq&&mq.addEventListener)mq.addEventListener('change',applyMotion);
applyMotion();
render();
</script>
